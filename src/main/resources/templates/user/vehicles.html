<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos | AlquilaTusVehiculos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/create.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar('vehicles')"></div>

<main class="rental-page">
    <section class="page-heading">
        <div class="page-heading-text">
            <h1>Vehículos disponibles</h1>
            <p>Explora nuestra flota y reserva el que más te guste</p>
        </div>
    </section>

    <div th:if="${vehicles != null and !#lists.isEmpty(vehicles)}"
         style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 1rem;">
        <article class="vehicle-card" th:each="v : ${vehicles}">
            <div class="vehicle-image">
                <div class="vehicle-image-placeholder">
                    <i class="fa-solid fa-car-side" style="font-size: 40px; color: #ccc;"></i>
                </div>
            </div>
            <div class="vehicle-body">
                <h3 th:text="${v.brand + ' ' + v.model}">Vehículo</h3>
                <p th:text="${v.description != null ? v.description : 'Sin descripción'}"></p>
                <p style="margin-top: 6px; font-size: 12px; color: #888;">
                    <span th:text="${v.plateNumber}"></span> ·
                    <span th:text="${v.manufacturingYear}"></span> ·
                    <span th:text="${v.gasType}"></span>
                </p>
                <p style="margin-top: 4px; font-weight: 700; font-size: 13px; color: #111;">
                    <span th:text="${v.dailyPrice}"></span> €/día
                </p>
                <div style="margin-top: 10px;">
                    <a th:href="@{/user/rentals/new}" class="btn btn-primary"
                       style="height: 32px; padding: 0 14px; font-size: 12px; border-radius: 6px; background: #f6bcc8; color: white; border: none; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none;">
                        Haz tu reserva
                    </a>
                </div>
            </div>
        </article>
    </div>

    <div class="empty-fleet" th:if="${vehicles == null or #lists.isEmpty(vehicles)}">
        <p>No hay vehículos disponibles.</p>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
