<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo alquiler | AlquilaTusVehiculos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/create.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar('rentals')"></div>

<main class="rental-page">
    <section class="page-heading">
        <a th:href="@{/user/rentals}" class="back-arrow">←</a>
        <div class="page-heading-text">
            <h1>Nuevo Alquiler</h1>
            <p>Completa los detalles de tu alquiler</p>
        </div>
    </section>

    <section class="content-layout"
             style="display:flex; justify-content:center; align-items:center;">
        <div class="form-panel" style="max-width:420px; width:100%;">
            <div th:if="${error}" class="message message-error" th:text="${error}"></div>
            <form th:action="@{/user/rentals/save}" th:object="${rental}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label>Cliente</label>
                    <input type="text" th:value="${users[0].name + ' - ' + users[0].email}" readonly
                           style="background:#e8e8e8;">
                    <input type="hidden" name="user.id" th:value="${users[0].id}">
                </div>

                <div class="form-group">
                    <label for="vehicle">Vehículo</label>
                    <select id="vehicle" name="vehicle.id" required>
                        <option value="" disabled th:selected="${rental.vehicle == null}">Seleccionar vehículo</option>
                        <option th:each="v : ${vehicles}"
                                th:value="${v.id}"
                                th:text="${v.brand + ' ' + v.model}"
                                th:selected="${rental.vehicle != null and rental.vehicle.id == v.id}">
                        </option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="startDate">Fecha Inicio</label>
                        <input id="startDate" type="date" name="startDate" required>
                    </div>
                    <div class="form-group half">
                        <label for="estimatedReturnDate">Fecha Fin</label>
                        <input id="estimatedReturnDate" type="date" name="estimatedReturnDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Total (€)</label>
                    <input type="text"
                           id="price"
                           value="Calculado automáticamente"
                           readonly
                           style="background:#f5f5f5; color:#666;">
                    <small>El precio se calculará automáticamente al guardar</small>
                </div>

                <div class="form-group">
                    <label>Notas</label>
                    <textarea th:field="*{note}" placeholder="Notas o requisitos especiales"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Crear alquiler</button>
                    <a th:href="@{/user/rentals}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
