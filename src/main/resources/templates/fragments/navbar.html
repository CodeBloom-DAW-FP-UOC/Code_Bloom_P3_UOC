<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="navbar(activeNav)">
    <header class="navbar">
        <div class="nav-container">

            <div class="nav-top">
                <div class="nav-brand">
                    <div class="nav-logo-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="24" height="24" fill="white">
                            <path d="M199.2 181.4L173.1 256L466.9 256L440.8 181.4C436.3 168.6 424.2 160 410.6 160L229.4 160C215.8 160 203.7 168.6 199.2 181.4zM103.6 260.8L138.8 160.3C152.3 121.8 188.6 96 229.4 96L410.6 96C451.4 96 487.7 121.8 501.2 160.3L536.4 260.8C559.6 270.4 576 293.3 576 320L576 512C576 529.7 561.7 544 544 544L512 544C494.3 544 480 529.7 480 512L480 480L160 480L160 512C160 529.7 145.7 544 128 544L96 544C78.3 544 64 529.7 64 512L64 320C64 293.3 80.4 270.4 103.6 260.8zM192 368C192 350.3 177.7 336 160 336C142.3 336 128 350.3 128 368C128 385.7 142.3 400 160 400C177.7 400 192 385.7 192 368zM480 400C497.7 400 512 385.7 512 368C512 350.3 497.7 336 480 336C462.3 336 448 350.3 448 368C448 385.7 462.3 400 480 400z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="nav-brand-title">AlquilaTusVehiculos</h1>
                        <p class="nav-brand-subtitle">by Code Bloom</p>
                    </div>
                </div>

                <div class="nav-user-section">
                    <div class="nav-user-info">
                        <p class="nav-user-name" sec:authentication="name">usuario@email.com</p>
                        <p class="nav-user-email">
                            <span sec:authorize="hasRole('ADMIN')">Administrador</span>
                            <span sec:authorize="hasRole('USER')">Usuario</span>
                        </p>
                    </div>

                    <div class="nav-user-avatar">
                        <span sec:authorize="hasRole('ADMIN')">A</span>
                        <span sec:authorize="hasRole('USER')">U</span>
                    </div>

                    <form th:action="@{/logout}" method="post" style="margin:0;">
                        <button type="submit" class="nav-item logout-btn" title="Cerrar sesión">
                            Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>

            <nav class="nav-links">
                <a th:href="@{/dashboard}" class="nav-item"
                   th:classappend="${activeNav == 'dashboard'} ? ' active' : ''">
                    Dashboard
                </a>

                <a th:href="@{/admin/rentals}" class="nav-item"
                   sec:authorize="hasRole('ADMIN')"
                   th:classappend="${activeNav == 'rentals'} ? ' active' : ''">
                    Alquileres
                </a>

                <a th:href="@{/vehicles}" class="nav-item"
                   sec:authorize="hasRole('ADMIN')"
                   th:classappend="${activeNav == 'vehicles'} ? ' active' : ''">
                    Vehículos
                </a>

                <a th:href="@{/admin/users}" class="nav-item"
                   sec:authorize="hasRole('ADMIN')"
                   th:classappend="${activeNav == 'users'} ? ' active' : ''">
                    Usuarios
                </a>

                <a th:href="@{/user/rentals}" class="nav-item"
                   sec:authorize="hasRole('USER')"
                   th:classappend="${activeNav == 'rentals'} ? ' active' : ''">
                    Mis alquileres
                </a>

                <a th:href="@{/user/vehicles}" class="nav-item"
                   sec:authorize="hasRole('USER')"
                   th:classappend="${activeNav == 'vehicles'} ? ' active' : ''">
                    Vehículos
                </a>

                <a th:href="@{/user/profile}" class="nav-item"
                   sec:authorize="hasRole('USER')"
                   th:classappend="${activeNav == 'profile'} ? ' active' : ''">
                    Mi perfil
                </a>
            </nav>

        </div>
    </header>
</div>

</body>
</html>
