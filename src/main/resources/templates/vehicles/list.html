<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos | AlquilaTusVehiculos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/create.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div th:replace="fragments/navbar :: navbar('vehicles')"></div>

<main class="rental-page">
    <section class="page-heading">
        <div class="page-heading-text">
            <h1>Vehículos</h1>
            <p>Consulta la flota de vehículos disponibles</p>
        </div>

        <a th:href="@{/admin/vehicles/new}"
           class="btn btn-primary"
           sec:authorize="hasRole('ADMIN')"
           style="margin-left:auto; height:42px; padding:0 22px; font-size:14px; border-radius:10px; font-weight:700;">
            + Nuevo vehículo
        </a>
    </section>

    <div th:if="${vehicles != null and !#lists.isEmpty(vehicles)}"
         style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 1rem;">

        <article class="vehicle-card" th:each="v : ${vehicles}">
            <div class="vehicle-image">
                <div class="vehicle-image-placeholder">
                    <i class="fa-solid fa-car-side" style="font-size: 40px; color: #ccc;"></i>
                </div>
            </div>

            <div class="vehicle-body">
                <h3 th:text="${v.brand + ' ' + v.model}">Vehículo</h3>

                <p th:text="${v.description != null ? v.description : 'Sin descripción'}">
                    Descripción
                </p>

                <p style="margin-top: 6px; font-size: 12px; color: #888;">
                    <span th:text="${v.plateNumber}">0000AAA</span> ·
                    <span th:text="${v.manufacturingYear}">2020</span> ·
                    <span th:text="${v.gasType}">Gasolina</span>
                </p>

                <p style="margin-top: 4px; font-weight: 700; font-size: 13px; color: #111;">
                    <span th:text="${v.dailyPrice}">0</span> €/día
                </p>

                <p style="margin-top: 4px; font-size: 12px; color: #666;">
                    Estado: <span th:text="${v.state != null ? v.state : '-'}">Disponible</span>
                </p>

                <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <a th:href="@{/user/rentals/new}"
                       class="btn btn-primary"
                       sec:authorize="hasRole('USER')"
                       style="height: 32px; padding: 0 14px; font-size: 12px; border-radius: 6px; background: #f6bcc8; color: white; border: none; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none;">
                        Reservar
                    </a>

                    <a th:href="@{/admin/vehicles/edit/{id}(id=${v.id})}"
                       class="table-btn edit-btn"
                       sec:authorize="hasRole('ADMIN')">
                        Editar
                    </a>

                    <a th:href="@{/admin/vehicles/delete/{id}(id=${v.id})}"
                       class="table-btn delete-btn"
                       sec:authorize="hasRole('ADMIN')"
                       onclick="return confirm('¿Seguro que quieres eliminar este vehículo?');">
                        Eliminar
                    </a>
                </div>
            </div>
        </article>
    </div>

    <div class="empty-fleet" th:if="${vehicles == null or #lists.isEmpty(vehicles)}">
        <p>No hay vehículos registrados.</p>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
